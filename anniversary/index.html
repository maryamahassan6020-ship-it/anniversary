<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e11d48">
<title>Happy Anniversary</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="petals"></div>

<div class="wrap">
  <header class="hero">
    <span class="corner l">🌷</span>
    <span class="corner r">🌹</span>
    <div class="tag">HAPPY ANNIVERSARY</div>
    <h1 id="names">Jamila &amp; Mohamed</h1>
    <div class="date" id="dateText"></div>
    <div class="counter" id="counter"></div>
  </header>

  <section>
    <h2>Our Album</h2>
    <div class="divider">🌸 🌺 🌸</div>
    <div class="gallery" id="gallery"></div>
  </section>

  <section>
    <h2>Wishes Wall</h2>
    <div class="divider">🌹 💐 🌹</div>
    <form id="wishForm">
      <input id="name" placeholder="Your name" maxlength="40" required>
      <textarea id="message" rows="3" placeholder="Write a sweet wish…" maxlength="300" required></textarea>
      <button class="btn" type="submit">Send wish 💖</button>
    </form>
    <div class="wishes" id="wishes"></div>
  </section>

  <footer>Made with love 🌸</footer>
</div>

<div class="lightbox" id="lightbox"><img alt=""></div>
<script src="script.js"></script>
</body>
</html>
